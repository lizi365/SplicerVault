<!DOCTYPE html><html><head><meta charset="UTF-8"><title>SPLICER VAULT v10.2</title><script src="https://cdn.jsdelivr.net/npm/@lit-protocol/lit-node-client-vanilla/lit-node-client.js"></script><style>body{background:#000;color:#0f0;font-family:Menlo,monospace;padding:40px}.box{max-width:600px;margin:0 auto;border:2px solid #0f0;padding:30px;background:#050505}#status{font-weight:700;margin-bottom:25px;color:#ffb100;padding:15px;border:1px dashed #444;text-align:center}textarea{width:100%;height:120px;background:#111;color:#0f0;border:1px solid #333;margin:15px 0;padding:12px}button{background:#0f0;color:#000;border:none;padding:18px;width:100%;font-weight:700;cursor:pointer}#out{margin-top:20px;display:none;word-break:break-all;border:1px solid #0f0;padding:10px;font-size:12px}</style></head><body><div class="box"><h3>🧩 SPLICER LOCAL VAULT v10.2</h3><div id="status">📡 正在探测主权信号...</div><textarea id="p" placeholder="在此粘贴明文 JSON..."></textarea><button id="b" disabled onclick="run()">[ 执行加密锁定 ]</button><div id="out"></div></div><script>const check=()=>{const s=window.LitJsSdk_litNodeClient||window.LitJsSdk;if(s){window.sdk=s;document.getElementById('status').innerText="✅ 逻辑引擎已就绪";document.getElementById('status').style.color="#0f0";document.getElementById('b').disabled=false;}else setTimeout(check,1000)};check();async function run(){try{const v=document.getElementById('p').value;const c=new window.sdk.LitNodeClient({litNetwork:'cayenne'});await c.connect();const a=await window.sdk.checkAndSignAuthMessage({chain:'base'});const acc=[{contractAddress:'0xc0F9F7d7759F84dD52F54Ab3f9960Df05A1BD3D4',standardContractType:'ERC20',chain:'base',method:'balanceOf',parameters:[':userAddress'],returnValueTest:{comparator:'>=',value:'1000000000000000000000'}}];const {ciphertext,dataToEncryptHash}=await c.encryptString({accessControlConditions:acc,authSig:a,chain:'base',dataToEncrypt:v},c);const res=JSON.stringify({ciphertext,dataToEncryptHash});document.getElementById('out').innerText=res;document.getElementById('out').style.display='block';}catch(e){alert("错误: "+e.message);}}</script></body></html>
